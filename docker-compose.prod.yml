version: "3.8"

services:
  # Nginx Production Reverse Proxy / Gateway
  gateway:
    image: nginx:1.25-alpine
    container_name: vantage-gateway
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Database Service (PostgreSQL 16)
  db:
    image: postgres:16-alpine
    container_name: vantage-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vantage_news}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-vantage_news}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis 7 Governance & Caching
  redis:
    image: redis:7-alpine
    container_name: vantage-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vantage-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vantage_news}}
      GOVERNANCE_BACKEND: ${GOVERNANCE_BACKEND:-redis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-vantage:gov:}
      ENVIRONMENT: production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      OPS_API_KEY: ${OPS_API_KEY}
      OPS_API_KEY_SECONDARY: ${OPS_API_KEY_SECONDARY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      ADMIN_API_KEY_SECONDARY: ${ADMIN_API_KEY_SECONDARY:-}
      SECURITY_API_KEY: ${SECURITY_API_KEY}
      SECURITY_API_KEY_SECONDARY: ${SECURITY_API_KEY_SECONDARY:-}
      ENABLE_OPS_CONTROLS: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_PERSPECTIVE_MODEL: ${OPENAI_PERSPECTIVE_MODEL:-gpt-4o-mini}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      REDDIT_USER_AGENT: ${REDDIT_USER_AGENT:-VantageNews/2.0.0}
      TRENDING_W1_VELOCITY: ${TRENDING_W1_VELOCITY:-0.35}
      TRENDING_W2_SOURCES: ${TRENDING_W2_SOURCES:-0.25}
      TRENDING_W3_ENGAGEMENT: ${TRENDING_W3_ENGAGEMENT:-0.25}
      TRENDING_W4_DECAY: ${TRENDING_W4_DECAY:-0.15}
      WORKER_INTERVAL_HOURS: ${WORKER_INTERVAL_HOURS:-2.0}
      MIN_TRENDING_SCORE_REFRESH: ${MIN_TRENDING_SCORE_REFRESH:-0.20}
      STAGNANT_HOURS_THRESHOLD: ${STAGNANT_HOURS_THRESHOLD:-48.0}
      ENABLE_ALERT_EVALUATION: "true"
      ALERT_WORKER_ENABLED: "true"
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_DIR: /app/backups
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_backups:/app/backups

  # Next.js Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vantage-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      INTERNAL_API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_backups:
    driver: local
